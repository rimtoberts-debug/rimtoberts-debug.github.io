<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace Tables tests – ApexIB Labs</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="../assets/apexib.css">
<style>li.ok::marker{color:var(--ok)}li.fail{color:var(--bad);font-weight:700}</style></head>
<body><main class="wrap"><h1>Trace Tables tests</h1><p id="summary" role="status">Running…</p><ul id="out"></ul>
<p><a href="index.html">← Back to the tool</a></p></main>
<footer class="wrap site-footer">ApexIB is independent and not affiliated with or endorsed by the International Baccalaureate Organization.</footer>
<script type="module">
import { runTests } from './tests.mjs';
const res = runTests(), out = document.getElementById('out');
for (const r of res) { const li = document.createElement('li'); li.className = r.ok ? 'ok' : 'fail'; li.textContent = (r.ok ? '✓ ' : '✗ ') + r.name + (r.ok ? '' : ' — ' + r.detail); out.append(li); }
const failed = res.filter((r) => !r.ok).length;
document.getElementById('summary').textContent = failed ? `${failed} of ${res.length} FAILED` : `All ${res.length} tests passed`;
document.title = (failed ? 'FAIL' : 'PASS') + ' – Trace Tables tests';
</script></body></html>
